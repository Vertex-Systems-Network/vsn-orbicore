name: Service Integration (PostgreSQL & Redis)
on:
  pull_request:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - "db/**"
      - "scripts/verify-service-containers.sh"
      - "scripts/verify-leased-jobs.sh"
      - "scripts/verify-postgres-job-repository.mjs"
      - "apps/api/postgres-jobs.mjs"
      - "apps/api/transactional-outbox.mjs"
      - "apps/api/synthetic-redis-worker.mjs"
      - "apps/api/synthetic-worker-runner.mjs"
      - "apps/api/postgres-identity-core.mjs"
      - "apps/api/postgres-feature-state.mjs"
      - "scripts/verify-postgres-feature-state.mjs"
      - "tests/postgres-feature-state.test.mjs"
      - "scripts/verify-postgres-identity-core.mjs"
      - "scripts/verify-postgres-auth-state.mjs"
      - "tests/postgres-auth-state.test.mjs"
      - "tests/postgres-identity-core.test.mjs"
      - "scripts/verify-pg-redis-outbox.mjs"
      - "scripts/verify-compose-restart.sh"
      - "scripts/verify-compose-redis-aof.mjs"
      - "scripts/fixtures/hold-synthetic-worker.mjs"
      - "package.json"
      - "package-lock.json"
      - "scripts/verify-runtime-clients.mjs"
      - "apps/api/server.mjs"
      - "scripts/verify-postgres-job-http.mjs"
      - "tests/postgres-http.test.mjs"
      - ".github/workflows/ci-services.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres-redis-parity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orbicore
          POSTGRES_USER: orbicore
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U orbicore -d orbicore"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Install Redis CLI for hosted service checks
        run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-tools
      - name: Verify hosted service schema, constraints and Redis I/O
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: orbicore
          PGDATABASE: orbicore
          PGPASSWORD: ci-test-password
        run: bash scripts/verify-service-containers.sh
      - name: Verify leased PostgreSQL worker contract and Redis Streams redelivery
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: orbicore
          PGDATABASE: orbicore
          PGPASSWORD: ci-test-password
        run: bash scripts/verify-leased-jobs.sh
      - name: Apply transactional PostgreSQL job outbox migration twice
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: orbicore
          PGDATABASE: orbicore
          PGPASSWORD: ci-test-password
        run: |
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/002_postgres_job_outbox.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/002_postgres_job_outbox.sql
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked runtime clients
        run: npm ci
      - name: Verify pinned Node PostgreSQL/Redis runtime clients
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: orbicore
          PGDATABASE: orbicore
          PGPASSWORD: ci-test-password
          ORBICORE_CI_REDIS_URL: redis://127.0.0.1:6379
        run: node scripts/verify-runtime-clients.mjs > .data/ci/orb-004-runtime-clients.json
      - name: Upload pinned runtime client proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orb-004-runtime-clients
          path: .data/ci/orb-004-runtime-clients.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Verify real Node PostgreSQL job repository and independent reconnect
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: orbicore
          PGDATABASE: orbicore
          PGPASSWORD: ci-test-password
        run: node scripts/verify-postgres-job-repository.mjs > .data/ci/orb-004-postgres-repository.json
      - name: Verify authenticated HTTP job routes against PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: orbicore
          PGDATABASE: orbicore
          PGPASSWORD: ci-test-password
        run: node scripts/verify-postgres-job-http.mjs > .data/ci/orb-004-postgres-http.json
      - name: Verify transactional outbox and Redis synthetic worker process-crash recovery
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: orbicore
          PGDATABASE: orbicore
          PGPASSWORD: ci-test-password
          ORBICORE_CI_REDIS_URL: redis://127.0.0.1:6379
        run: node scripts/verify-pg-redis-outbox.mjs > .data/ci/orb-004-outbox-worker.json
      - name: Upload outbox worker and SIGKILL recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orb-004-outbox-worker-recovery
          path: .data/ci/orb-004-outbox-worker.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload HTTP PostgreSQL job integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orb-004-postgres-http-evidence
          path: .data/ci/orb-004-postgres-http.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Node repository integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orb-004-postgres-job-repository
          path: .data/ci/orb-004-postgres-repository.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload job-lease recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orb-004-leased-job-evidence
          path: .data/ci/orb-004-lease-evidence.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload scoped service-parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orb-016-hosted-service-parity
          path: .data/ci/orb-016-service-parity.json
          if-no-files-found: ignore
          retention-days: 14

  compose-volume-recovery:
    name: Disposable Compose volume and AOF persistence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked runtime clients
        run: npm ci
      - name: Recreate Compose service containers without deleting named volumes
        run: bash scripts/verify-compose-restart.sh
      - name: Upload Compose persistence, AOF and natural lease recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orb-016-compose-recovery
          path: |
            .data/ci/orb-016-compose-aof-before.json
            .data/ci/orb-016-compose-worker.json
            .data/ci/orb-016-compose-recovery.json
          if-no-files-found: ignore
          retention-days: 14

  postgres-identity-scope:
    name: Disposable PostgreSQL identity snapshot and RLS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orbicore
          POSTGRES_USER: orbicore
          POSTGRES_PASSWORD: ci-identity-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U orbicore -d orbicore"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: orbicore
      PGDATABASE: orbicore
      PGPASSWORD: ci-identity-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked runtime dependencies
        run: npm ci
      - name: Initialize isolated PostgreSQL and rerunnable identity migration
        run: |
          psql -X -v ON_ERROR_STOP=1 -f db/postgres-schema.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/001_postgres_job_leases.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/002_postgres_job_outbox.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/003_postgres_identity_core_rls.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/003_postgres_identity_core_rls.sql
      - name: Verify synthetic offline snapshot, PostgreSQL session policy, and non-bypass tenant role
        run: |
          mkdir -p .data/ci
          node scripts/verify-postgres-identity-core.mjs > .data/ci/orb-005-identity-core.json
      - name: Upload read-scoped PostgreSQL identity migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orb-005-postgres-identity-core
          path: .data/ci/orb-005-identity-core.json
          if-no-files-found: ignore
          retention-days: 14

  postgres-auth-state:
    name: Disposable PostgreSQL MFA/passkey/recovery schema and offline snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orbicore
          POSTGRES_USER: orbicore
          POSTGRES_PASSWORD: ci-auth-state-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U orbicore -d orbicore"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: orbicore
      PGDATABASE: orbicore
      PGPASSWORD: ci-auth-state-only-password
      ORBICORE_CI_SYNTHETIC_AUTH_IMPORT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Initialize PostgreSQL identity and rerunnable auth state schema
        run: |
          psql -X -v ON_ERROR_STOP=1 -f db/postgres-schema.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/001_postgres_job_leases.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/002_postgres_job_outbox.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/003_postgres_identity_core_rls.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/004_postgres_auth_state.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/004_postgres_auth_state.sql
      - name: Verify atomic synthetic MFA, passkey, recovery and notification import
        run: |
          mkdir -p .data/ci
          node scripts/verify-postgres-auth-state.mjs > .data/ci/orb-005-auth-state.json
      - name: Upload auth-state schema and PostgreSQL tenant security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orb-005-postgres-auth-state
          path: .data/ci/orb-005-auth-state.json
          if-no-files-found: ignore
          retention-days: 14

  postgres-feature-state:
    name: Disposable PostgreSQL tenant operational features and atomic snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orbicore
          POSTGRES_USER: orbicore
          POSTGRES_PASSWORD: ci-feature-state-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U orbicore -d orbicore"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: orbicore
      PGDATABASE: orbicore
      PGPASSWORD: ci-feature-state-only-password
      ORBICORE_CI_SYNTHETIC_AUTH_IMPORT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Initialize PostgreSQL and prove rerunnable operational feature migration
        run: |
          psql -X -v ON_ERROR_STOP=1 -f db/postgres-schema.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/001_postgres_job_leases.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/002_postgres_job_outbox.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/003_postgres_identity_core_rls.sql
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/004_postgres_auth_state.sql
          # A pre-migration site lacking organization_id must backfill from its
          # owning account; clean up before the separate empty-target importer.
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO organizations(id, name) VALUES ('org-pre005-ci', 'Synthetic pre-migration tenant');
          INSERT INTO accounts(id, organization_id, label, provider, host, username,
            health, used_bytes, quota_bytes, source)
            VALUES ('account-pre005-ci', 'org-pre005-ci', 'Only mock',
              'mock', 'no-host.example.invalid', 'fixture', 'healthy', 0, 1, 'mock_fixture');
          INSERT INTO sites(id, account_id, domain, kind, document_root, php_version, status)
            VALUES ('site-pre005-ci', 'account-pre005-ci', 'pre005.example.invalid',
              'static', '/tmp/ci-fixture', '8.3', 'active');
          SQL
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/005_postgres_feature_state.sql
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $proof$
          BEGIN
            IF (SELECT organization_id FROM sites WHERE id='site-pre005-ci')
                IS DISTINCT FROM 'org-pre005-ci' THEN
              RAISE EXCEPTION 'existing_site_tenant_backfill_failed';
            END IF;
          END
          $proof$;
          DELETE FROM sites WHERE id='site-pre005-ci';
          DELETE FROM accounts WHERE id='account-pre005-ci';
          DELETE FROM organizations WHERE id='org-pre005-ci';
          SQL
          psql -X -v ON_ERROR_STOP=1 -f db/migrations/005_postgres_feature_state.sql
      - name: Verify atomic synthetic feature copy, tenant FKs, safe RLS and rollback
        run: |
          mkdir -p .data/ci
          node scripts/verify-postgres-feature-state.mjs > .data/ci/orb-005-feature-state.json
      - name: Upload PostgreSQL operational feature migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orb-005-postgres-feature-state
          path: .data/ci/orb-005-feature-state.json
          if-no-files-found: ignore
          retention-days: 14
