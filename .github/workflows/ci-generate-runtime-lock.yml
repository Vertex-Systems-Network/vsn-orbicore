name: Temporary runtime dependency lockfile generator
on:
  push:
    branches: ["feat/orb-004-runtime-dependencies"]
    paths:
      - ".github/workflows/ci-generate-runtime-lock.yml"
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Create npm official registry lockfile (no install scripts)
        run: |
          npm ci --ignore-scripts --no-audit
          npm install --package-lock-only --ignore-scripts --no-audit --save-exact pg@8.23.1 redis@6.3.1
      - name: Print manifest and lock for authenticated GitHub-only import
        run: |
          node -e 'const fs = require("node:fs"); for(const [file,prefix] of [["package.json","ORBPJ::"],["package-lock.json","ORBPL::"]]) for(const line of fs.readFileSync(file,"utf8").split("\n")) console.log(prefix+line);'
