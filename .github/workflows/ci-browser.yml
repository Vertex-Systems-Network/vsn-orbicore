name: Browser E2E & Accessibility (WebAuthn Virtual Authenticator)
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "scripts/browser-verify.mjs"
      - "scripts/browser-native-zoom.mjs"
      - "scripts/browser-text-resize.mjs"
      - "scripts/browser-cross-engine.mjs"
      - "tests/fixtures/native-zoom-extension/**"
      - ".github/workflows/ci-browser.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-webauthn-a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Playwright Chromium runner
        run: npm install --no-save playwright && npx playwright install chromium
      - name: Run browser WebAuthn & accessibility checks
        env:
          ORBICORE_BOOTSTRAP_TOKEN: ci-browser-bootstrap-token-32bytes
          ORBICORE_MFA_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: node scripts/browser-verify.mjs
      - name: Verify real Chromium 200% and 400% page zoom
        env:
          ORBICORE_BOOTSTRAP_TOKEN: ci-browser-bootstrap-token-32bytes
        run: node scripts/browser-native-zoom.mjs
      - name: Verify synthetic 200% text-only resizing and controls
        env:
          ORBICORE_BOOTSTRAP_TOKEN: ci-browser-bootstrap-token-32bytes
        run: node scripts/browser-text-resize.mjs
      - name: Upload non-sensitive browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: orb-012-browser-evidence
          path: .data/browser-evidence/
          if-no-files-found: ignore
          retention-days: 14

  firefox-webkit-reflow:
    name: ${{ matrix.engine }} responsive auth/workspace and keyboard check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Playwright browser and Ubuntu dependencies
        run: npm install --no-save playwright && npx playwright install --with-deps ${{ matrix.engine }}
      - name: Run isolated Firefox/WebKit responsive and keyboard regressions
        env:
          ORBICORE_BOOTSTRAP_TOKEN: ci-cross-engine-owner-token-32bytes
          ORBICORE_CROSS_BROWSER_ENGINE: ${{ matrix.engine }}
        run: node scripts/browser-cross-engine.mjs
      - name: Upload synthetic cross-engine evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: orb-009-018-cross-engine-${{ matrix.engine }}
          path: .data/browser-evidence/cross-engine-${{ matrix.engine }}.json
          if-no-files-found: ignore
          retention-days: 14
