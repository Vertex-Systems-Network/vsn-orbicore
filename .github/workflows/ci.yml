name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run security:check
      - name: Export lockfile CycloneDX SBOM
        run: node scripts/generate-sbom.mjs
      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orb-015-cyclonedx-sbom
          path: .data/ci/orbicore-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Audit high and critical dependency vulnerabilities
        run: npm audit --audit-level=high
      - run: npm run build
      - run: npm run smoke
      - run: npm run doctor
