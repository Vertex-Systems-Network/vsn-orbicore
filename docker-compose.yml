services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: orbicore
      POSTGRES_USER: orbicore
      POSTGRES_PASSWORD: ${ORBICORE_POSTGRES_PASSWORD:-replace-before-nonlocal-use}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbicore -d orbicore"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./db/postgres-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
